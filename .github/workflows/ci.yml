name: CI

on:
  # No merge_group — Merge Queue off by default (Fast Trunk).
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Test
    runs-on: sylphx-linux-standard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static owned runner profiles
        run: bash scripts/check-owned-runner-profiles.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Run tests
        run: bun test packages --timeout 30000
        timeout-minutes: 5

      - name: Type check
        run: bun run typecheck

  lint:
    name: Lint
    runs-on: sylphx-linux-standard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static owned runner profiles
        run: bash scripts/check-owned-runner-profiles.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
